<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CFO Automation System</title>

  <!-- Excel reader -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 30px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      color: #cbd5e1;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .card h2 {
      margin-top: 0;
    }

    .upload-box {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      background: #f8fafc;
    }

    input[type="file"] {
      margin: 20px 0;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #374151;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      background: #dbeafe;
      color: #1e40af;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .stat {
      background: #f8fafc;
      border-radius: 10px;
      padding: 18px;
    }

    .stat-title {
      color: #64748b;
      font-size: 13px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      margin-top: 6px;
    }

    @media(max-width:700px) {

      .stats {
        grid-template-columns: 1fr 1fr;
      }

    }

  </style>

</head>


<body>


  <div class="header">

    <h1>📊 CFO Automation System</h1>

    <p>CBD Master — Version 1</p>

  </div>


  <div class="container">


    <!-- Upload -->

    <div class="card">

      <h2>Upload CBD Excel</h2>

      <p>
        Upload the original CBD Excel file.
        The system will automatically read the
        <b>Articles</b> sheet.
      </p>


      <div class="upload-box">

        <div>
          📁 Select CBD Excel File
        </div>

        <input
          type="file"
          id="fileInput"
          accept=".xlsx,.xls"
        >

        <br>

        <button
          id="uploadBtn"
          onclick="processCBD()"
        >
          Process CBD
        </button>

      </div>


      <div
        id="status"
        class="status"
      ></div>

    </div>


    <!-- Summary -->

    <div class="card">

      <h2>CBD Summary</h2>

      <div class="stats">

        <div class="stat">

          <div class="stat-title">
            Articles
          </div>

          <div
            class="stat-value"
            id="articles"
          >
            0
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Forecast Quantity
          </div>

          <div
            class="stat-value"
            id="forecastQty"
          >
            0
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Revenue
          </div>

          <div
            class="stat-value"
            id="revenue"
          >
            ₹0
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Profit
          </div>

          <div
            class="stat-value"
            id="profit"
          >
            ₹0
          </div>

        </div>

      </div>

    </div>


  </div>


<script>


/************************************************
 * COLUMN MAPPING
 *
 * Articles sheet:
 *
 * Row 2 = headers
 * Row 3 onwards = data
 ************************************************/


const REQUIRED_COLUMNS = {

  articleId:
    "Unique Identifier",

  creationDate:
    "Creation Date",

  changedDate:
    "Changed Date",

  articleName:
    "Article Name",

  articleGroup:
    "Article Group Name",

  customerSupplier:
    "IKEA Supplier Name",

  forecastQty:
    "Forecasted Yearly volume",

  avgOrderQty:
    "Average Order Quantity",

  boardSelection:
    "Board Selection",

  construction:
    "Construction (FEFCO / IKEA /Drawing)",

  netSize:
    "Article Net Size (m2)",

  weightG:
    "Weight (g)",

  weightKg1000:
    "Weight excl waste (Kg) / 1000pcs",

  materialCost:
    "Material cost inc waste INR/1000pcs",

  corrugationCost:
    "Corrugation cost INR/1000pcs",

  conversionCost:
    "Conversion cost with volume discount INR/1000pcs",

  packagingCost:
    "Packaging cost INR/1000pcs",

  productionCost:
    "Production cost INR/1000pcs",

  otherCost:
    "Other Cost INR/1000pcs",

  priceExclCommission:
    "Price excl commission",

  commission:
    "IKEA Commission",

  priceInclCommission:
    "Price incl commission INR/1000pcs",

  palletCost:
    "Pallet Cost",

  transportCost:
    "Transport Cost",

  ddu:
    "DDU",

  toolCost:
    "Tool Cost",

  totalWeight:
    "Total Weight",

  profit:
    "Profit INR/1000pcs",

  extraCost:
    "Extra Cost",

  mssStatus:
    "MSS Status",

  ikeaQuality:
    "IKEA Quality"

};


/**
 * Main upload process.
 */
function processCBD() {

  const input =
    document.getElementById("fileInput");

  const button =
    document.getElementById("uploadBtn");

  if (!input.files.length) {

    showStatus(
      "Please select the CBD Excel file first.",
      "error"
    );

    return;
  }


  const file = input.files[0];


  button.disabled = true;

  showStatus(
    "Reading Excel file...",
    "info"
  );


  const reader = new FileReader();


  reader.onload = function(e) {

    try {

      const workbook =
        XLSX.read(
          e.target.result,
          {
            type: "array",
            cellDates: true
          }
        );


      /*
       * Make sure Articles exists.
       */

      if (!workbook.SheetNames.includes("Articles")) {

        throw new Error(
          'The Excel file does not contain an "Articles" sheet.'
        );

      }


      const worksheet =
        workbook.Sheets["Articles"];


      /*
       * Convert sheet to JSON.
       *
       * Row 2 contains headers.
       */

      const raw =
        XLSX.utils.sheet_to_json(
          worksheet,
          {
            range: 1,
            defval: ""
          }
        );


      if (!raw.length) {

        throw new Error(
          "No article data found in the Articles sheet."
        );

      }


      /*
       * Validate required columns.
       */

      const headers =
        Object.keys(raw[0]);


      const missing = [];


      Object.keys(REQUIRED_COLUMNS)
        .forEach(key => {

          const column =
            REQUIRED_COLUMNS[key];

          if (!headers.includes(column)) {
            missing.push(column);
          }

        });


      if (missing.length) {

        throw new Error(
          "Missing columns: " +
          missing.join(", ")
        );

      }


      /*
       * Convert to our clean structure.
       */

      const rows =
        raw
          .filter(row =>
            String(
              row[REQUIRED_COLUMNS.articleId] || ""
            ).trim() !== ""
          )
          .map(row => {

            return {

              articleId:
                row[REQUIRED_COLUMNS.articleId],

              creationDate:
                row[REQUIRED_COLUMNS.creationDate],

              changedDate:
                row[REQUIRED_COLUMNS.changedDate],

              articleName:
                row[REQUIRED_COLUMNS.articleName],

              articleGroup:
                row[REQUIRED_COLUMNS.articleGroup],

              customerSupplier:
                row[REQUIRED_COLUMNS.customerSupplier],

              forecastQty:
                row[REQUIRED_COLUMNS.forecastQty],

              avgOrderQty:
                row[REQUIRED_COLUMNS.avgOrderQty],

              boardSelection:
                row[REQUIRED_COLUMNS.boardSelection],

              construction:
                row[REQUIRED_COLUMNS.construction],

              netSize:
                row[REQUIRED_COLUMNS.netSize],

              weightG:
                row[REQUIRED_COLUMNS.weightG],

              weightKg1000:
                row[REQUIRED_COLUMNS.weightKg1000],

              materialCost:
                row[REQUIRED_COLUMNS.materialCost],

              corrugationCost:
                row[REQUIRED_COLUMNS.corrugationCost],

              conversionCost:
                row[REQUIRED_COLUMNS.conversionCost],

              packagingCost:
                row[REQUIRED_COLUMNS.packagingCost],

              productionCost:
                row[REQUIRED_COLUMNS.productionCost],

              otherCost:
                row[REQUIRED_COLUMNS.otherCost],

              priceExclCommission:
                row[REQUIRED_COLUMNS.priceExclCommission],

              commission:
                row[REQUIRED_COLUMNS.commission],

              priceInclCommission:
                row[REQUIRED_COLUMNS.priceInclCommission],

              palletCost:
                row[REQUIRED_COLUMNS.palletCost],

              transportCost:
                row[REQUIRED_COLUMNS.transportCost],

              ddu:
                row[REQUIRED_COLUMNS.ddu],

              toolCost:
                row[REQUIRED_COLUMNS.toolCost],

              totalWeight:
                row[REQUIRED_COLUMNS.totalWeight],

              profit:
                row[REQUIRED_COLUMNS.profit],

              extraCost:
                row[REQUIRED_COLUMNS.extraCost],

              mssStatus:
                row[REQUIRED_COLUMNS.mssStatus],

              ikeaQuality:
                row[REQUIRED_COLUMNS.ikeaQuality]

            };

          });


      showStatus(
        "Found " +
        rows.length +
        " articles. Saving to Google Sheets...",
        "info"
      );


      /*
       * Send to Apps Script.
       */

      google.script.run

        .withSuccessHandler(function(result) {

          button.disabled = false;


          showStatus(
            "✅ Successfully imported " +
            result.imported +
            " articles into CBD_Master.",
            "success"
          );


          loadSummary();

        })

        .withFailureHandler(function(error) {

          button.disabled = false;

          showStatus(
            "❌ " +
            error.message,
            "error"
          );

        })

        .saveCBDData({
          rows: rows
        });


    }

    catch(error) {

      button.disabled = false;

      showStatus(
        "❌ " + error.message,
        "error"
      );

    }

  };


  reader.readAsArrayBuffer(file);

}


/**
 * Load summary.
 */
function loadSummary() {

  google.script.run

    .withSuccessHandler(function(data) {

      document.getElementById("articles")
        .textContent =
        formatNumber(data.articles);


      document.getElementById("forecastQty")
        .textContent =
        formatNumber(data.forecastQty);


      document.getElementById("revenue")
        .textContent =
        formatMoney(data.totalRevenue);


      document.getElementById("profit")
        .textContent =
        formatMoney(data.totalProfit);

    })

    .getCBDSummary();

}


/**
 * Status message.
 */
function showStatus(message, type) {

  const box =
    document.getElementById("status");

  box.style.display = "block";

  box.className =
    "status " + type;

  box.textContent = message;

}


/**
 * Number formatting.
 */
function formatNumber(value) {

  return Number(value || 0)
    .toLocaleString("en-IN");

}


/**
 * Money formatting.
 */
function formatMoney(value) {

  return "₹" +
    Number(value || 0)
      .toLocaleString(
        "en-IN",
        {
          maximumFractionDigits: 0
        }
      );

}


window.onload = function() {

  loadSummary();

};


</script>


</body>

</html>
